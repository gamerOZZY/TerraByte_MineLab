version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: gamerOZZY
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: bd
    ports:
      - "5432:5432"
    restart: always
    networks:
      - red_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamerOZZY -d bd"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  cod_python:
    build: ./scripts
    container_name: cod_python
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red_local

networks:
  red_local:
    driver: bridge
